kind = "mobile"
previewPath = "/"
title = "Home Control"
description = "A mobile smart-home controller for organizing Tuya devices by room, adding lights, chandeliers, heaters, and air conditioners, and controlling them through Tuya Cloud."
version = "1.0.0"
id = "artifacts/home-control"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23418

[services.development]
run = "pnpm --filter @workspace/home-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-control", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/home-control", "run", "serve" ]

[services.env]
PORT = "23418"
BASE_PATH = "/"
